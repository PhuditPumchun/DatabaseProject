<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; padding:40px; }
    .box { max-width:360px; margin:auto; background:#fff; border-radius:8px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,.1); }
    h2 { margin:0 0 16px; text-align:center; color:#333; }
    .row { margin-bottom:12px; }
    label { display:block; margin-bottom:4px; color:#444; font-size:.9rem; }
    input, select { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:.95rem; }
    button { width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; }
    button:hover { background:#0069d9; }
    .register { margin-top:14px; text-align:center; font-size:.85rem; }
    .register a { color:#007bff; text-decoration:none; }
    .register a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="box">
  <h2>Log In</h2>

  <form action="{{ url_for('handle_login_form') }}" method="POST">
    <div class="row">
      <label for="username">Username</label>
      <input id="username" name="username" required />
    </div>
    <div class="row">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required />
    </div>
    <div class="row">
      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
      </select>
    </div>
    <button type="submit">Login</button>
  </form>

  <div class="register">
    No account yet? <a href="{{ url_for('register_select_role') }}">Register</a>
  </div>
</div>
</body>
</html>
