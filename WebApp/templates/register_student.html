<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Register (Student)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; padding:40px; }
    .box { max-width:420px; margin:auto; background:#fff; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.1); padding:24px; }
    h2 { margin:0 0 16px; text-align:center; font-size:1.2rem; color:#333; }
    .error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; border-radius:4px; padding:8px; font-size:.85rem; margin-bottom:12px; }
    .row { margin-bottom:12px; }
    label { display:block; margin-bottom:4px; color:#444; font-size:.9rem; }
    input { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:.95rem; }
    button { width:100%; padding:10px; background:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; }
    button:hover { background:#218838; }
    .back { margin-top:14px; text-align:center; font-size:.85rem; }
    .back a { color:#007bff; text-decoration:none; }
    .back a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="box">
  <h2>Register (Student)</h2>

  {% if error_msg %}
    <div class="error">{{ error_msg }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('register_student') }}">
    <div class="row">
      <label for="name">Name</label>
      <input id="name" name="name" required />
    </div>
    <div class="row">
      <label for="username">Username</label>
      <input id="username" name="username" required />
    </div>
    <div class="row">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required />
    </div>
    <button type="submit">Create account</button>
  </form>

  <div class="back">
    <a href="{{ url_for('register_select_role') }}">Back</a> |
    <a href="{{ url_for('login_page') }}">Login</a>
  </div>
</div>
</body>
</html>
