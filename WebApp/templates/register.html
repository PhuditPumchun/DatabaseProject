<!-- templates/register.html -->
<!-- [ADDED] role select page -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      padding:40px;
    }
    .box {
      max-width:420px;
      margin:auto;
      background:#fff;
      border-radius:8px;
      box-shadow:0 4px 16px rgba(0,0,0,.1);
      padding:24px;
      text-align:center;
    }
    h2 {
      margin:0 0 12px;
      color:#333;
      font-size:1.2rem;
    }
    .btn {
      display:block;
      width:100%;
      padding:10px;
      border-radius:6px;
      margin-top:10px;
      text-decoration:none;
      color:#fff;
      font-weight:600;
      text-align:center;
      font-size:.9rem;
    }
    .btn.blue { background:#007bff; }
    .btn.gray { background:#6c757d; }
    .btn:hover { filter:brightness(.95); }

    .back {
      margin-top:16px;
      font-size:.85rem;
    }
    .back a {
      color:#007bff;
      text-decoration:none;
    }
    .back a:hover {
      text-decoration:underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create an account</h2>

    <!-- ไปหน้า Register Student (ถ้าคุณมี /register/student อยู่แล้ว) -->
    <a class="btn blue" href="{{ url_for('register_student') }}">
      I am a Student
    </a>

    <!-- ไปหน้า Register Instructor (อันที่เราเพิ่งเพิ่ม) -->
    <a class="btn blue" href="{{ url_for('register_instructor') }}">
      I am an Instructor
    </a>

    <div class="back">
      <a href="{{ url_for('login_page') }}">Back to Login</a>
    </div>
  </div>
</body>
</html>
